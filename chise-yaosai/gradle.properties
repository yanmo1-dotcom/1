// ============================================================
// gradle.properties —— Gradle 构建与运行时参数
// ============================================================

// ----- JVM 内存配置 -----
// LibGDX 桌面运行 + Lwjgl3 启动器建议至少 1G 堆内存，避免大地图/音频占用导致 OOM
org.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8

// ----- Gradle 行为 -----
// 并行构建（core 与 desktop 可并行编译）
org.gradle.parallel=true
// 按 CPU 核心数自动配置工作线程
org.gradle.workers.max=4
// 启用配置缓存（Gradle 9.0 已稳定支持，但第三方插件可能尚未完全适配；
// 若构建出现 configuration cache 警告，可临时改为 false 排查）
org.gradle.configuration-cache=true
// 启用构建缓存
org.gradle.caching=true
// 守护进程保持运行，提升二次构建速度
org.gradle.daemon=true

// ----- LibGDX 版本统一管理 -----
// 协议要求：LibGDX 1.12.x。这里固定为 1.12.1（1.12 系列最新稳定版）。
// 升级时只需改这一处，各子项目通过引用属性名自动同步。
gdxVersion=1.12.1
// Lwjgl3 是 LibGDX 推荐的现代桌面后端（取代旧的 lwjgl2）
lwjgl3Version=3.3.3
// JUnit5 用于后续单元测试（吉普车物理、碰撞检测等纯逻辑可脱离渲染测试）
junitVersion=5.10.2
