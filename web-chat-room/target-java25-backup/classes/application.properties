# Session Cookie 跨域配置 (解决 Live Server 跨域丢 Cookie 问题)
server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.path=/
server.servlet.session.cookie.http-only=true

# 数据目录（用户/消息/好友申请 JSON 文件）。Linux 服务器用默认值，
# Windows 开发可在环境变量或此处覆盖，例如：webchat.data-dir=D:/webchat-data/users/
webchat.data-dir=${WEBCHAT_DATA_DIR:./.runtime-data/users/}

# 管理员重置密码
admin.password=default_admin_pass

# 对战数据（默认与 webchat.data-dir 同目录；如需分离可在此覆盖）
# webchat.matches-file=
# webchat.rank-rules-file=

# Admin dashboard password; override with ADMIN_PASSWORD in production.
admin.password=${ADMIN_PASSWORD:13412341}

# Database. Default is a persistent local H2 file; point DB_URL at MySQL in production.
spring.datasource.url=${DB_URL:jdbc:h2:file:./.runtime-data/webchat-db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.sql.init.mode=always
spring.sql.init.platform=${DB_PLATFORM:h2}
spring.sql.init.continue-on-error=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
