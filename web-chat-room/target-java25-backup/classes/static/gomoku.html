<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>五子棋对局</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:16px;font-family:"Microsoft YaHei",sans-serif;background:#f5f6fa;color:#333}.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.header h2{margin:0;font-size:20px}.room-id{font-size:13px;color:#777}.players{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:10px}.player{display:flex;align-items:center;gap:8px;padding:8px 13px;border-radius:7px;background:#fff;border:1px solid #ddd}.player.turn{border-color:#28a745;box-shadow:0 0 0 2px #28a74533}.stone,.piece{border-radius:50%;display:inline-block}.stone{width:20px;height:20px}.black{background:#161616}.white{background:#fff;border:1px solid #999}.status{padding:10px 13px;background:#eeeeff;border-radius:7px;margin-bottom:10px}.ready-row{display:flex;gap:10px;align-items:center;margin-bottom:12px}.ready-row button,.actions button{padding:8px 18px;border:0;border-radius:5px;color:#fff;cursor:pointer}.ready-row button{background:#6c5ce7}.ready-txt{font-size:13px;color:#666}.board-wrap{display:flex;justify-content:center;overflow:auto;padding:2px}.board{display:grid;grid-template-columns:repeat(15,34px);grid-template-rows:repeat(15,34px);background-color:#dcb35c;background-image:linear-gradient(#5c421f 1px,transparent 1px),linear-gradient(90deg,#5c421f 1px,transparent 1px);background-size:34px 34px;background-position:23px 23px;padding:6px;border-radius:7px;box-shadow:0 2px 9px #0003}.cell{width:34px;height:34px;border:0;background:transparent;cursor:pointer;position:relative;display:flex;align-items:center;justify-content:center;padding:0}.cell:hover:not(:disabled){background:#ffffff36}.cell:disabled{cursor:default}.piece{width:28px;height:28px}.piece.black{box-shadow:1px 1px 3px #0008}.piece.white{box-shadow:1px 1px 3px #0005}.cell.last:after{content:"";position:absolute;width:7px;height:7px;background:#e84118;border-radius:50%}.result{margin-top:12px;padding:10px;text-align:center;font-weight:bold;background:#fff3cd;border-radius:6px;display:none}.actions{margin-top:12px}.actions button{background:#e74c3c}@media(max-width:600px){body{padding:8px}.board{grid-template-columns:repeat(15,6vw);grid-template-rows:repeat(15,6vw);background-size:6vw 6vw;background-position:calc(3vw + 4px) calc(3vw + 4px);padding:4px}.cell{width:6vw;height:6vw}.piece{width:82%;height:82%}}
</style></head><body>
<div class="header"><h2>⚫ 五子棋对局</h2><span class="room-id" id="roomIdTxt"></span></div><div class="players" id="players"></div><div class="status" id="status">正在读取对局...</div><div class="ready-row" id="readyRow"><button id="readyBtn">准备</button><span class="ready-txt" id="readyTxt"></span></div><div class="board-wrap"><div class="board" id="board"></div></div><div class="result" id="result"></div><div class="actions"><button onclick="leaveGame()">离开/弃赛</button></div>
<script>
const SIZE=15,params=new URLSearchParams(location.search),roomId=params.get('roomId'),me=Number(params.get('userId')),token=localStorage.getItem('myToken_'+me);let myReady=false,loading=false,current={players:[],playerDetails:[],readyPlayers:[],state:'WAITING',board:null};roomIdTxt.textContent='房间：'+(roomId||'-');
const emptyBoard=()=>Array.from({length:SIZE},()=>Array(SIZE).fill(0));
function render(){renderPlayers();renderBoard();renderStatus()}
function renderPlayers(){players.innerHTML='';const ids=(current.players||[]).map(Number),details=current.playerDetails||[];ids.forEach((id,i)=>{const info=details.find(x=>Number(x.id)===id),mine=id===me,turn=Number(current.currentTurnPlayerId)===id,d=document.createElement('div');d.className='player'+(turn?' turn':'');d.innerHTML=`<span class="stone ${i===0?'black':'white'}"></span><span>${mine?'我':'对手'}（${esc(info?.name||('ID '+id))} · ${info?.rankPoints||0}分）${turn?' · 落子中':''}</span>`;players.appendChild(d)});if(!ids.length)players.textContent='正在读取玩家信息...'}
function renderStatus(){const n=(current.players||[]).length;if(current.state==='WAITING')status.textContent=`等待准备：${n}/${current.capacity||2} 人`;else if(current.state==='READY')status.textContent='双方已准备，对局即将开始...';else if(current.state==='PLAYING')status.textContent=Number(current.currentTurnPlayerId)===me?'轮到你落子':'对手思考中...';else status.textContent='对局已结束';readyRow.style.display=current.state==='WAITING'?'flex':'none'}
function renderBoard(){board.innerHTML='';const b=current.board||emptyBoard(),canMove=current.state==='PLAYING'&&Number(current.currentTurnPlayerId)===me,last=current.lastMove;for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++){const cell=document.createElement('button'),v=Number(b[r]?.[c]||0);cell.className='cell';if(v){cell.innerHTML=`<span class="piece ${v===1?'black':'white'}"></span>`;cell.disabled=true;if(last&&Number(last[0])===r&&Number(last[1])===c)cell.classList.add('last')}else if(canMove)cell.onclick=()=>placeMove(r,c);else cell.disabled=true;board.appendChild(cell)}}
async function request(path,opt={}){if(!token)throw Error('缺少登录凭证');opt.headers={...(opt.headers||{}),'Content-Type':'application/json','Authorization':'Bearer '+token};const res=await fetch(path,opt);return res.json()}
async function loadState(){if(loading||!roomId||!token)return;loading=true;try{const data=await request(`/api/game/rooms/${roomId}`,{cache:'no-store'});if(data.code===200){current={...current,...data.data};myReady=(current.readyPlayers||[]).map(Number).includes(me);readyBtn.textContent=myReady?'取消准备':'准备';readyTxt.textContent=`${(current.readyPlayers||[]).length}/${(current.players||[]).length} 已准备`;render()}else if(data.code===404){current.state='FINISHED';render();result.textContent='房间已结束或不存在';result.style.display='block'}}catch(e){status.textContent=e.message||'连接失败，正在重试...'}finally{loading=false}}
async function placeMove(row,col){try{const data=await request(`/api/game/rooms/${roomId}/gomoku-move`,{method:'POST',body:JSON.stringify({row,col})});if(data.code!==200)alert(data.msg||'落子失败');if(data.data){current={...current,...data.data};render()}else await loadState()}catch(e){alert(e.message||'网络错误')}}
readyBtn.onclick=async()=>{try{const data=await request(`/api/game/rooms/${roomId}/ready`,{method:'POST',body:JSON.stringify({ready:!myReady})});if(data.code!==200)alert(data.msg||'操作失败');await loadState()}catch(e){alert(e.message||'网络错误')}};
async function leaveGame(){if(!confirm('确定离开/弃赛？'))return;try{await request(`/api/game/rooms/${roomId}/leave`,{method:'POST'})}catch(e){}window.close()}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
render();if(!roomId||!me||!token){status.textContent='房间参数或登录凭证缺失，请重新进入房间'}else{loadState();setInterval(loadState,700)}
</script></body></html>
