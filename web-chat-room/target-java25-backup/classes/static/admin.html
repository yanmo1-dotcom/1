<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>超级管理员后台</title><style>
*{box-sizing:border-box}body{margin:0;background:#080f17;color:#e6edf6;font-family:system-ui,"Microsoft YaHei",sans-serif}button,input,select{font:inherit;border-radius:7px;padding:9px 12px;border:1px solid #26364a}.login{width:380px;margin:18vh auto;background:#101a28;padding:32px;border:1px solid #223149;border-radius:18px;box-shadow:0 20px 60px #0008}.login input,.login button{width:100%;margin-top:14px}.login button,.primary{background:#1787f7;color:white;border:0;cursor:pointer}.app{display:none;max-width:1500px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center;background:#101a28;border:1px solid #223149;border-radius:18px;padding:25px 28px}.top h2{margin:0}.top small{color:#8fa4bc;margin-left:15px}.badge{background:#162235;padding:9px 18px;border-radius:25px}.dot{color:#27d17f}.layout{display:grid;grid-template-columns:280px 1fr;gap:22px;margin-top:22px}.side,.panel{background:#101a28;border:1px solid #223149;border-radius:18px;padding:24px}.side h3{margin-top:0}.stat{background:#172336;border-radius:13px;padding:18px;margin:12px 0;color:#91a5bc}.stat b{display:block;color:#eaf2fb;font-size:26px;margin-top:5px}.tabs{display:flex;gap:22px;border-bottom:2px solid #d7dfeb;margin-bottom:18px}.tabs button{background:none;border:0;color:#8296ad;border-radius:0;padding:10px 0;cursor:pointer}.tabs button.on{color:#39a0ff;border-bottom:3px solid #1688f7}.title-row{display:flex;align-items:center;justify-content:space-between}table{width:100%;border-collapse:collapse;background:#f9fbfe;color:#405066}th,td{text-align:left;padding:14px 12px;border-bottom:1px solid #dfe6ee}th{color:#7e8da0;font-size:14px}td input,td select{max-width:110px;background:white}.btn{border:1px solid #ccd7e3;background:white;color:#405066;cursor:pointer;padding:7px 10px;margin:2px}.danger{background:#eaa02b;color:white;border:0}.green{background:#55bf30;color:white;border:0}.hide{display:none}pre{white-space:pre-wrap}.toast{position:fixed;top:25px;left:50%;transform:translateX(-50%);background:#eafbe5;color:#50aa32;padding:13px 24px;border-radius:6px;display:none}@media(max-width:900px){.layout{grid-template-columns:1fr}.app{padding:10px}.panel{overflow:auto}.top small{display:none}}
</style></head><body><div class="toast" id="toast">✓ 操作成功</div>
<section class="login" id="login"><h2>超级管理员登录</h2><p style="color:#8fa4bc">用户、积分与战绩由关系型数据库持久化</p><input id="password" type="password" placeholder="管理员密码"><button onclick="signIn()">登录</button><p id="error" style="color:#ff6b6b"></p></section>
<main class="app" id="app"><header class="top"><div><h2>超级管理员后台 <small>管理账号、调整积分、查看战绩与审计记录</small></h2></div><div><span class="badge"><span class="dot">●</span> admin</span>　<button class="btn" onclick="logout()">退出</button></div></header>
<div class="layout"><aside class="side"><h3>数据库概览</h3><div class="stat">注册用户<b id="usersCount">-</b></div><div class="stat">在线用户<b id="online">-</b></div><div class="stat">累计对局<b id="matchesCount">-</b></div><div class="stat">数据引擎<b style="font-size:15px" id="storage">-</b></div></aside>
<section class="panel"><div class="tabs"><button class="on" onclick="tab('users',this)">用户管理</button><button onclick="tab('matches',this)">战绩记录</button><button onclick="tab('rules',this)">积分配置</button><button onclick="tab('logs',this)">审计记录</button><button onclick="tab('system',this)">系统监控</button></div>
<div id="users"><div class="title-row"><h2>用户列表</h2><button class="btn" onclick="loadUsers()">刷新</button></div><table><thead><tr><th>ID</th><th>用户名/昵称</th><th>角色</th><th>账号状态</th><th>在线</th><th>积分余额</th><th>最近登录</th><th>操作</th></tr></thead><tbody id="userRows"></tbody></table></div>
<div id="matches" class="hide"><h2>最近战绩</h2><table><thead><tr><th>ID</th><th>游戏</th><th>玩家 A</th><th>玩家 B</th><th>胜者</th><th>结果</th><th>结束时间</th></tr></thead><tbody id="matchRows"></tbody></table></div>
<div id="rules" class="hide"><h2>积分规则</h2><form id="ruleForm" onsubmit="saveRules(event)"><p>胜利 <input name="winPoints" type="number">　失败 <input name="lossPoints" type="number">　平局 <input name="drawPoints" type="number"></p><p>初始 <input name="initialPoints" type="number">　最低 <input name="minPoints" type="number">　分差阈值 <input name="diffThreshold" type="number">　爆冷奖励 <input name="upsetBonus" type="number"></p><button class="primary">保存并热更新</button></form></div>
<div id="logs" class="hide"><h2>管理员审计记录</h2><table><thead><tr><th>ID</th><th>操作</th><th>目标</th><th>详情</th><th>时间</th></tr></thead><tbody id="logRows"></tbody></table></div><div id="system" class="hide"><h2>系统监控</h2><pre id="metrics"></pre></div></section></div></main>
<script>
let key=sessionStorage.adminKey||'';const api='/api/admin';async function req(path,opt={}){opt.headers={...(opt.headers||{}),'Content-Type':'application/json','X-Admin-Password':key};const r=await fetch(api+path,opt);if(r.status===401){sessionStorage.removeItem('adminKey');throw Error('管理员密码错误')}if(r.status===404)throw Error('记录不存在');return r.json()}async function signIn(){key=password.value;try{await req('/login',{method:'POST',body:JSON.stringify({password:key})});sessionStorage.adminKey=key;show();notify('登录成功')}catch(e){error.textContent=e.message}}function logout(){sessionStorage.removeItem('adminKey');location.reload()}async function show(){login.style.display='none';app.style.display='block';await Promise.all([loadMetrics(),loadUsers(),loadMatches(),loadRules(),loadLogs()])}
async function loadMetrics(){const d=(await req('/metrics')).data;online.textContent=d.onlineUsers;usersCount.textContent=d.totalUsers;matchesCount.textContent=d.totalMatches;storage.textContent=d.storage;metrics.textContent=JSON.stringify(d,null,2)}async function loadUsers(){const d=(await req('/users')).data;userRows.innerHTML=d.map(u=>`<tr><td>${u.id}</td><td><b>${esc(u.username)}</b><br><small>${esc(u.nickname||'')}</small></td><td>${u.role}</td><td><select id="s${u.id}"><option ${u.status==='ACTIVE'?'selected':''}>ACTIVE</option><option ${u.status==='MUTED'?'selected':''}>MUTED</option><option ${u.status==='BANNED'?'selected':''}>BANNED</option></select></td><td>${u.online?'🟢 online':'offline'}</td><td><input id="p${u.id}" type="number" value="${u.rankPoints}"></td><td>${u.lastLoginAt?new Date(u.lastLoginAt).toLocaleString():'-'}</td><td><button class="btn ${u.status==='BANNED'?'green':'danger'}" onclick="toggleUser(${u.id},'${u.status}')">${u.status==='BANNED'?'启用':'禁用'}</button><button class="btn" onclick="saveUser(${u.id})">改积分</button><button class="btn" onclick="resetPassword(${u.id})">重置密码</button></td></tr>`).join('')}
async function saveUser(id){await req('/users/'+id,{method:'PATCH',body:JSON.stringify({rankPoints:+document.querySelector('#p'+id).value,status:document.querySelector('#s'+id).value})});notify();await Promise.all([loadUsers(),loadLogs()])}async function toggleUser(id,status){document.querySelector('#s'+id).value=status==='BANNED'?'ACTIVE':'BANNED';await saveUser(id)}async function resetPassword(id){const p=prompt('输入新密码（至少 6 位）：');if(!p)return;try{const d=await req(`/users/${id}/reset-password`,{method:'POST',body:JSON.stringify({newPassword:p})});if(d.code!==200)throw Error(d.msg);notify('密码已重置');await loadLogs()}catch(e){alert(e.message)}}
async function loadMatches(){const d=(await req('/matches')).data;matchRows.innerHTML=d.map(m=>`<tr><td>${m.id}</td><td>${esc(m.gameType)}</td><td>${m.playerAId??'-'}</td><td>${m.playerBId??'-'}</td><td>${m.winnerId??'平局'}</td><td>${m.result||'-'}</td><td>${new Date(m.finishedAt).toLocaleString()}</td></tr>`).join('')}async function loadRules(){const d=(await req('/rules')).data;for(const[k,v]of Object.entries(d))if(ruleForm.elements[k])ruleForm.elements[k].value=v}async function saveRules(e){e.preventDefault();const b=Object.fromEntries(new FormData(ruleForm));for(const k in b)b[k]=+b[k];await req('/rules',{method:'PUT',body:JSON.stringify(b)});notify('配置已热更新');loadLogs()}async function loadLogs(){const d=(await req('/logs')).data;logRows.innerHTML=d.map(x=>`<tr><td>${x.ID??x.id}</td><td>${esc(x.ACTION??x.action)}</td><td>${esc(x.TARGET??x.target||'-')}</td><td>${esc(x.DETAIL_TEXT??x.detail_text||'')}</td><td>${new Date(x.CREATED_AT??x.created_at).toLocaleString()}</td></tr>`).join('')}
function tab(id,b){document.querySelectorAll('.panel>div:not(.tabs)').forEach(x=>x.classList.add('hide'));document.querySelector('#'+id).classList.remove('hide');document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));b.classList.add('on')}function notify(t='操作成功'){toast.textContent='✓ '+t;toast.style.display='block';setTimeout(()=>toast.style.display='none',1800)}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}if(key)show();
</script></body></html>
