<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web 聊天室</title>
    <!-- 引入 SockJS 和 Stomp.js -->
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <style>
        /* 简单的样式美化 */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .chat-container { width: 400px; height: 600px; background: white; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: flex; flex-direction: column; overflow: hidden; }
        
        /* 顶部连接区 */
        .connect-area { padding: 15px; background: #007bff; color: white; display: flex; gap: 10px; align-items: center; }
        .connect-area input { flex: 1; padding: 8px; border: none; border-radius: 4px; outline: none; }
        .connect-area button { padding: 8px 15px; border: none; background: #0056b3; color: white; border-radius: 4px; cursor: pointer; }
        .connect-area button:hover { background: #004494; }
        .connect-area button:disabled { background: #ccc; cursor: not-allowed; }

        /* 聊天记录区 */
        #message-area { flex: 1; padding: 15px; overflow-y: auto; background: #f9f9f9; display: flex; flex-direction: column; gap: 8px; }
        .msg { max-width: 80%; padding: 8px 12px; border-radius: 8px; font-size: 14px; line-height: 1.4; word-wrap: break-word; }
        .msg.self { align-self: flex-end; background: #007bff; color: white; border-bottom-right-radius: 0; }
        .msg.other { align-self: flex-start; background: #e9ecef; color: #333; border-bottom-left-radius: 0; }
        .msg .sender { font-weight: bold; font-size: 12px; margin-bottom: 2px; opacity: 0.8; }
        .sys-msg { align-self: center; font-size: 12px; color: #888; margin: 5px 0; }

        /* 底部输入区 */
        .input-area { padding: 15px; border-top: 1px solid #eee; display: flex; gap: 10px; }
        .input-area input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 20px; outline: none; }
        .input-area button { padding: 10px 20px; border: none; background: #28a745; color: white; border-radius: 20px; cursor: pointer; }
        .input-area button:hover { background: #218838; }
        .input-area button:disabled { background: #ccc; cursor: not-allowed; }
        body { flex-direction: column; justify-content: flex-start; height: 100vh; }
        .topbar { width: 100%; background: #1e2336; color: #9aa0b4; padding: 10px 20px; font-size: .85rem; box-sizing: border-box; }
        .topbar a { color: #6ea8fe; text-decoration: none; }
    </style>
</head>
<body>
<div class="topbar"><a href="index.html">← 返回作品集首页</a>　｜　聊天室前端 Demo</div>
<div class="chat-container">
    <!-- 1. 连接区域 -->
    <div class="connect-area">
        <input type="text" id="nickname" placeholder="请输入你的昵称" value="用户A">
        <button id="connect-btn" onclick="connect()">连接</button>
    </div>

    <!-- 2. 聊天记录区域 -->
    <div id="message-area">
        <div class="sys-msg">等待连接服务器...</div>
    </div>

    <!-- 3. 发送区域 -->
    <div class="input-area">
        <input type="text" id="message-input" placeholder="输入消息..." disabled onkeypress="handleKeyPress(event)">
        <button id="send-btn" onclick="sendMessage()" disabled>发送</button>
    </div>
</div>

<script>
    let stompClient = null;
    const nicknameInput = document.getElementById('nickname');
    const connectBtn = document.getElementById('connect-btn');
    const messageInput = document.getElementById('message-input');
    const sendBtn = document.getElementById('send-btn');
    const messageArea = document.getElementById('message-area');

    // 连接 WebSocket
    function connect() {
        const nickname = nicknameInput.value.trim();
        if (!nickname) { alert('请先输入昵称！'); return; }

        // 禁用连接按钮，防止重复点击
        connectBtn.disabled = true;
        connectBtn.innerText = '连接中...';
        addSystemMessage(`正在连接服务器...`);

        // 创建 SockJS 对象
        const socket = new SockJS('http://localhost:8080/ws');
        stompClient = Stomp.over(socket);

        // 连接到 STOMP 代理
        stompClient.connect({}, function (frame) {
            addSystemMessage(`✅ 连接成功！欢迎 ${nickname}`);
            
            // 启用发送功能
            nicknameInput.disabled = true;
            messageInput.disabled = false;
            sendBtn.disabled = false;
            messageInput.focus();

            // 订阅消息频道
            stompClient.subscribe('/topic/messages', function (message) {
                showMessage(JSON.parse(message.body));
            });
        }, function (error) {
            addSystemMessage(`❌ 连接失败: ${error}`);
            connectBtn.disabled = false;
            connectBtn.innerText = '重连';
        });
    }

    // 发送消息
    function sendMessage() {
        const content = messageInput.value.trim();
        if (!content || !stompClient) return;

        const chatMessage = {
            sender: nicknameInput.value,
            content: content,
            timestamp: new Date().toLocaleTimeString()
        };

        // 发送到后端接口
        stompClient.send("/app/chat", {}, JSON.stringify(chatMessage));
        messageInput.value = ''; // 清空输入框
    }

    // 显示消息到界面
    function showMessage(msg) {
        const isSelf = msg.sender === nicknameInput.value;
        const div = document.createElement('div');
        div.className = `msg ${isSelf ? 'self' : 'other'}`;
        
        // 构建消息 HTML
        div.innerHTML = `
            <div class="sender">${msg.sender} <span style="font-weight:normal; font-size:10px; opacity:0.7">${msg.timestamp || ''}</span></div>
            <div>${escapeHtml(msg.content)}</div>
        `;
        
        messageArea.appendChild(div);
        messageArea.scrollTop = messageArea.scrollHeight; // 自动滚动到底部
    }

    // 添加系统提示消息
    function addSystemMessage(text) {
        const div = document.createElement('div');
        div.className = 'sys-msg';
        div.innerText = text;
        messageArea.appendChild(div);
        messageArea.scrollTop = messageArea.scrollHeight;
    }

    // 回车发送
    function handleKeyPress(event) {
        if (event.key === 'Enter') sendMessage();
    }

    // 简单的 XSS 防护
    function escapeHtml(text) {
        if (!text) return text;
        return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }
</script>

</body>
</html>
